[virtual_sdcard]
path: /var/lib/moonraker/gcodes
on_error_gcode:
    M400

[pause_resume]
[display_status]

[mcu]
serial: /dev/serial/by-id/usb-Klipper_rp2040_E6647C74037BA737-if00

[input_shaper]
shaper_type_y: mzv
shaper_freq_y: 68
shaper_type_x: mzv
shaper_freq_x: 68

[printer]
kinematics: delta
max_velocity: 400
max_accel: 10000
max_z_velocity: 100
max_z_accel: 100
delta_radius: 92
print_radius: 60
minimum_z_position:-4

[force_move]
enable_force_move: True

[delta_calibrate]
radius: 25 # This number sets the radius of the points used in "DELTA_CALIBRATE"
horizontal_move_z: 5 # how far up the nozzle moves from the bed on each point. you can lower this number to speed up the "DELTA_CALIBRATE" process

[stepper_a]
step_pin: gpio6
dir_pin: !gpio3
enable_pin: !gpio7
microsteps: 64
rotation_distance: 40
full_steps_per_rotation: 200
endstop_pin: ^gpio13
homing_speed: 80
position_endstop: 133.74
arm_length: 150
angle: 212.86 #212.689114
homing_retract_dist: 10
second_homing_speed: 5
[tmc2209 stepper_a]
uart_pin: gpio9
uart_address: 0
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

[stepper_b]
step_pin: gpio1
dir_pin: !gpio0
enable_pin: !gpio2
microsteps: 64
rotation_distance: 40
full_steps_per_rotation: 200
endstop_pin: ^gpio14
homing_speed: 80
position_endstop: 134.03
angle: 329.98 #329.987282
arm_length: 150
homing_retract_dist: 10
second_homing_speed: 5
[tmc2209 stepper_b]
uart_pin: gpio9
uart_address: 1
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

[stepper_c]
step_pin: gpio26
dir_pin: !gpio25
enable_pin: !gpio27
microsteps: 64
rotation_distance: 40
full_steps_per_rotation: 200
endstop_pin: ^gpio15
homing_speed: 80
position_endstop: 130.89
angle: 90.000000
arm_length: 150
homing_retract_dist: 10
second_homing_speed: 5
[tmc2209 stepper_c]
uart_pin: gpio9
uart_address: 2
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

[extruder]
step_pin: gpio23
dir_pin: !gpio22
enable_pin: !gpio24
full_steps_per_rotation: 200
gear_ratio: 50:17
rotation_distance: 11.21
pressure_advance: 0.181
pressure_advance_smooth_time: 0.040
microsteps: 64
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: gpio20
sensor_type: EPCOS 100K B57560G104F
sensor_pin: gpio28
control: pid
pid_Kp: 21.527 # These are "generic" PID values, these will be ignored after the first PID tune.
pid_Ki: 1.063
pid_Kd: 108.982
min_temp: 0
max_temp: 350
min_extrude_temp: 0
[tmc2209 extruder]
uart_pin: gpio9
uart_address: 3
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

[heater_fan hotend_fan]
pin: gpio16
max_power: 1
heater: extruder
heater_temp: 35.0
shutdown_speed: 0

[fan]
pin: gpio17

[heater_bed]
heater_pin: gpio21
sensor_type: EPCOS 100K B57560G104F
sensor_pin: gpio29
control: pid
pid_Kp: 54.027
pid_Ki: 0.770
pid_Kd: 948.182
min_temp: 0
max_temp: 130

[endstop_phase]
[exclude_object]
[gcode_arcs]
resolution: 0.1

[gcode_macro PRINT_START]
gcode:
    {% set extruder = params.EXTRUDER|default(0)|int %}
    {% set bed = params.BED|default(0) %}
    {% set ch = params.CHAMBER|default(0) %}
    M104 S{extruder}
    M140 S{bed}
    M190 S{bed}
    M109 S{extruder}
    G28
    G90
    M107

[gcode_macro print_over]
gcode:
    M400 ; Clear move buffer
    G92 E0 ; Zero extruder
    G1 E-20.0 F3600 ; Retract
    G28 ; home, return to top
    M107 ; turn off fans

[gcode_macro PRINT_END]
gcode:
    print_over
    TURN_OFF_HEATERS

[gcode_macro CANCEL_PRINT]
rename_existing: CANCEL_PRINT_BASE
gcode:
    print_over
    CANCEL_PRINT_BASE

