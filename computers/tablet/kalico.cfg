[mcu]
serial: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
restart_method: command

[printer]
kinematics: delta
max_velocity: 400
max_accel: 10000
max_z_velocity: 100
max_z_accel: 100
delta_radius: 60
minimum_z_position:-1

[force_move]
enable_force_move: True

[delta_calibrate]
radius: 50 # This number sets the radius of the points used in "DELTA_CALIBRATE"
horizontal_move_z: 20 # how far up the nozzle moves from the bed on each point. you can lower this number to speed up the "DELTA_CALIBRATE" process

[stepper_a]
step_pin: PB9
dir_pin: PC2
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
full_steps_per_rotation: 200
endstop_pin: ^PA5
homing_speed: 80
position_endstop: 142 # If you are building a taller or shorter Delta Flyer, change this to fit your build size.
arm_length: 150
angle: 221 #212.689114
homing_retract_dist: 10
second_homing_speed: 5

[stepper_b]
step_pin: PB7
dir_pin: PB8
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
full_steps_per_rotation: 200
endstop_pin: !PA6
homing_speed: 80
position_endstop: 142 # If you are building a taller or shorter Delta Flyer, change this to fit your build size.
angle: 330 #329.987282
arm_length: 150
homing_retract_dist: 10
second_homing_speed: 5

[stepper_c]
step_pin: PB5
dir_pin: PB6
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
full_steps_per_rotation: 200
endstop_pin: ^PA7
homing_speed: 80
position_endstop: 142 # If you are building a taller or shorter Delta Flyer, change this to fit your build size.
angle: 90.000000
arm_length: 150
homing_retract_dist: 10
second_homing_speed: 5

[extruder]
step_pin: PB3
dir_pin: PB4
enable_pin: !PC3
full_steps_per_rotation: 200
gear_ratio: 50:17
rotation_distance: 11.21
pressure_advance: 0.181
pressure_advance_smooth_time: 0.040
microsteps: 16
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PA1
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC5
control: pid
pid_Kp: 21.527 # These are "generic" PID values, these will be ignored after the first PID tune.
pid_Ki: 1.063
pid_Kd: 108.982
min_temp: 0
max_temp: 350

[heater_fan hotend_fan]
pin: PA0
max_power: 0.6
heater: extruder
heater_temp: 35.0
shutdown_speed: 0

[endstop_phase]
[exclude_object]
[gcode_arcs]
resolution: 0.1
