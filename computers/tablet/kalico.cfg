[mcu]
serial: /dev/serial/by-id/usb-Klipper_rp2040_E6647C74037BA737-if00

[printer]
kinematics: delta
max_velocity: 400
max_accel: 10000
max_z_velocity: 100
max_z_accel: 100
delta_radius: 75
minimum_z_position:-1

[force_move]
enable_force_move: True

[delta_calibrate]
radius: 25 # This number sets the radius of the points used in "DELTA_CALIBRATE"
horizontal_move_z: 20 # how far up the nozzle moves from the bed on each point. you can lower this number to speed up the "DELTA_CALIBRATE" process

[stepper_a]
step_pin: gpio6
dir_pin: !gpio3
enable_pin: !gpio7
microsteps: 64
rotation_distance: 40
full_steps_per_rotation: 200
endstop_pin: ^gpio13
homing_speed: 80
position_endstop: 142
arm_length: 150
angle: 221 #212.689114
homing_retract_dist: 10
second_homing_speed: 5
[tmc2209 stepper_a]
uart_pin: gpio9
uart_address: 0
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

[stepper_b]
step_pin: gpio1
dir_pin: !gpio0
enable_pin: !gpio2
microsteps: 64
rotation_distance: 40
full_steps_per_rotation: 200
endstop_pin: ^gpio14
homing_speed: 80
position_endstop: 142
angle: 330 #329.987282
arm_length: 150
homing_retract_dist: 10
second_homing_speed: 5
[tmc2209 stepper_b]
uart_pin: gpio9
uart_address: 1
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

[stepper_c]
step_pin: gpio26
dir_pin: !gpio25
enable_pin: !gpio27
microsteps: 64
rotation_distance: 40
full_steps_per_rotation: 200
endstop_pin: ^gpio15
homing_speed: 80
position_endstop: 142
angle: 90.000000
arm_length: 150
homing_retract_dist: 10
second_homing_speed: 5
[tmc2209 stepper_c]
uart_pin: gpio9
uart_address: 2
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

[extruder]
step_pin: gpio23
dir_pin: !gpio22
enable_pin: !gpio24
full_steps_per_rotation: 200
gear_ratio: 50:17
rotation_distance: 11.21
pressure_advance: 0.181
pressure_advance_smooth_time: 0.040
microsteps: 64
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: gpio20
sensor_type: EPCOS 100K B57560G104F
sensor_pin: gpio28
control: pid
pid_Kp: 21.527 # These are "generic" PID values, these will be ignored after the first PID tune.
pid_Ki: 1.063
pid_Kd: 108.982
min_temp: 0
max_temp: 350
min_extrude_temp: 0
[tmc2209 extruder]
uart_pin: gpio9
uart_address: 3
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

[heater_fan hotend_fan]
pin: gpio16
max_power: 1
heater: extruder
heater_temp: 35.0
shutdown_speed: 0

[fan]
pin: gpio17

[heater_bed]
heater_pin: gpio21
sensor_type: EPCOS 100K B57560G104F
sensor_pin: gpio29
control: pid
pid_Kp: 54.027
pid_Ki: 0.770
pid_Kd: 948.182
min_temp: 0
max_temp: 130

[endstop_phase]
[exclude_object]
[gcode_arcs]
resolution: 0.1

[gcode_macro PRINT_START]
gcode:
    G28 ; home
    G90 ; absolute positioning
    G1 Z20 F3000 ; move up 20mm

[gcode_macro PRINT_END]
gcode:
    M400 ; Clear move buffer
    G92 E0 ; Zero extruder
    G1 E-20.0 F3600 ; Retract
    G28 ; home, return to top
    TURN_OFF_HEATERS
    M107 ; turn off fans
